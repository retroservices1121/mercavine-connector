name: Security CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: read
jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail on high/critical advisories in production dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
